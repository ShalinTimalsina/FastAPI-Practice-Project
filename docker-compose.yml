services:

###################################################################################
                           ## Frontend[React + Nginx] ## 
###################################################################################
  frontend: 
    image: frontend-react:1.0
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fast-frontend-app
    ports:
      - 80:80
    networks:
      - frontend-network  
    depends_on:
      - backend
    restart: unless-stopped
    
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

 
###################################################################################
                           ## Backend ## 
###################################################################################
 
  backend:
    image: fast-api-app:1.0
    env_file:
      - .env
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fast-backend-app
    ports:
      - 8000:8000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - database
    networks:
      - db-network
      - frontend-network
  
###################################################################################
                           ## Database ## 
###################################################################################
 
  database:
    image: postgres:16.2-alpine
    env_file:
      - .env
    container_name: postgres-database
    restart: unless-stopped 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network
    volumes:
      - pgdb-fast:/var/lib/postgresql/data
    
###################################################################################
                           ## Database Visualizer ## 
###################################################################################
 
  
  Adminer:
    image: adminer:4.8.1
    container_name: Adminer-db
    ports:
      - 8080:8080
    depends_on:
      - database
    networks:
      - db-network

networks:
  db-network:
  frontend-network:

volumes: 
  pgdb-fast:
