name: CI/CD Pipeline for 3 tier app (Fastapi, React and Postgres-Sql )

on:
  push:
    branches: [main]
  
jobs:

  compile:

    name: Compile and Build Validation
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout the code in the runner.
        uses: actions/checkout@v6.0.2
      
      - name: Verify docker's status
        run: |
          docker --version 
          docker info > /dev/null

      - name: Backend Code Compilation
        run: |
          cd backend
          docker build --target builder -t be-compile . 

      - name: Frontend Code compilation 
        run: |
          cd frontend
          docker build --target builder -t fe-compile .


  gitleaks:

    runs-on: ubuntu-latest
    needs: compile

    steps:
      - name: Checkout the code in the runner.
        uses: actions/checkout@v6.0.2
        
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9 
        with: 
          args: detect --source . --exit-code 1  


  tests:

    name: Unit Test Backend and Frontend
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      
      - name: Checkout the code in the runner.
        uses: actions/checkout@v6.0.2
      
      # Backend Test
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14
      
      - name: Install uv 
        run: |
          pip install --upgrade uv 

      - name: Install Backend Dependencies
        run: | 
          cd backend
          uv sync 
      
      - name: Run Backend Unit test
        run: | 
          cd backend
          uv run pytest

      # Frontend Tests
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
      
      - name: Install Frontend Dependencies
        run: | 
          cd frontend
          npm ci 
      
      - name: Run Frontend tests
        run: |
          cd frontend 
          npm test -- --watch=false
  

  build:

    name: Build the docker image
    runs-on: ubuntu-latest
    needs: tests

    steps:  

      - name: Login to Docker hub 
        uses: docker/login-action@v4.1.0
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v4.0.0
        
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and Push 
        uses: docker/build-push-action@v7.1.0
        with: 
          context: . 
          push: true
          tags: shalintim/fast-app:latest
  
  # push:

  # deploy:

